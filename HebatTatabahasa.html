ompok","si tompok","si Tompok"],correctIndex:1,explanation:"Kata Nama Khas bagi haiwan mesti ditulis dengan huruf besar pada setiap awal perkataan."},{id:W(),topicId:1,pattern:"B",text:"Analisis Hukum: 'bapa bekerja di kementerian pendidikan malaysia.'",options:["BENAR","SALAH"],correctIndex:1,explanation:"SALAH. Perkataan 'bapa' di awal ayat mesti huruf besar, dan institusi 'Kementerian Pendidikan Malaysia' adalah Kata Nama Khas."},{id:W(),topicId:1,pattern:"A",text:"Beberapa orang ________ sedang membersihkan kawasan balai raya itu.",options:["pemuda","Pemuda","kampung","Kampung"],correctIndex:0,explanation:"'pemuda' merupakan kata nama am manusia dan tidak berada di awal ayat."},{id:W(),topicId:1,pattern:"A",text:"Encik Ramli memandu kereta ________ buatan Malaysia.",options:["Proton persona","proton Persona","Proton Persona","proton persona"],correctIndex:2,explanation:"Jenama kereta adalah Kata Nama Khas, perlu huruf besar di setiap pangkal kata."},{id:W(),topicId:1,pattern:"B",text:"Analisis Hukum: 'Kereta Proton itu milik Ahmad.'",options:["BENAR","SALAH"],correctIndex:0,explanation:"BENAR. 'Proton' ialah Kata Nama Khas jenama, dan 'Ahmad' ialah Kata Nama Khas nama orang."});Ka.push({id:W(),topicId:2,pattern:"A",text:"“Bolehkah ________ bantu saya siapkan tugasan ini?” tanya Ali kepada Muthu.",options:["awak","aku","beliau","baginda"],correctIndex:0,explanation:"'awak' merujuk kepada diri kedua (orang yang dilawan bercakap)."},{id:W(),topicId:2,pattern:"A",text:"“Ampun ________, sembah ________ harap diampun,” sembah Laksamana Hang Tuah kepada sultan.",options:["tuanku ... patik","baginda ... beta","tuanku ... beta","baginda ... hamba"],correctIndex:0,explanation:"Bahasa istana: 'tuanku' untuk raja (ganti nama diri kedua), 'patik' untuk rakyat yang bercakap dengan raja (diri pertama)."},{id:W(),topicId:2,pattern:"B",text:"Analisis Hukum: 'Buku itu telah koyak kerana ia terlalu lama.'",options:["BENAR","SALAH"],correctIndex:1,explanation:"SALAH. Kata ganti nama 'ia' hanya boleh digunakan untuk benda hidup dan abstrak, BUKAN untuk benda tak hidup seperti buku."},{id:W(),topicId:2,pattern:"A",text:"________lah orang yang telah menolong saya kelmarin.",options:["Itu","Sini","Mana","Apa"],correctIndex:0,explanation:"'Itu' ialah kata ganti nama tunjuk yang merujuk kepada orang/benda yang jauh."},{id:W(),topicId:2,pattern:"A",text:"Dr. Zaki seorang doktor yang pakar. ________ bertugas di Hospital Besar Kuala Lumpur.",options:["Dia","Mereka","Beliau","Ia"],correctIndex:2,explanation:"'Beliau' digunakan untuk orang yang dihormati dan mempunyai kedudukan/pangkat."});Ka.push({id:W(),topicId:3,pattern:"A",text:"Ibu sedang ________ nasi di dapur.",options:["menanak","memasak","mengukus","merebus"],correctIndex:0,explanation:"Kata kerja yang paling tepat untuk proses memasak nasi menggunakan air ialah menanak."},{id:W(),topicId:3,pattern:"B",text:"Analisis Hukum: 'Surat itu telah dibaca oleh saya semalam.'",options:["BENAR","SALAH"],correctIndex:1,explanation:"SALAH. Kata ganti nama diri pertama (saya) tidak boleh menggunakan format pasif 'di... oleh'. Yang betul: Surat itu telah saya baca."},{id:W(),topicId:3,pattern:"A",text:"Puan Zaiton ________ anaknya kerana bermain di tepi sungai.",options:["memarahi","marahkan","memarah","dimarahi"],correctIndex:0,explanation:"Akhiran '-i' sesuai untuk kata kerja transitif yang objeknya merupakan orang yang menerima kesan perbuatan (anaknya)."},{id:W(),topicId:3,pattern:"A",text:"Adik sedang ________ di ruang tamu.",options:["tidur","meniduri","tidurkan","ditidur"],correctIndex:0,explanation:"'tidur' ialah kata kerja tak transitif yang boleh berdiri sendiri tanpa objek."},{id:W(),topicId:3,pattern:"B",text:"Analisis Hukum: 'Buku itu Ali baca.'",options:["BENAR","SALAH"],correctIndex:1,explanation:"SALAH. 'Ali' ialah kata ganti diri ketiga, mesti menggunakan pasif imbuhan 'di'. Yang betul: Buku itu dibaca oleh Ali."});Ka.push({id:W(),topicId:4,pattern:"A",text:"Baju pengantin itu berwarna ________.",options:["merah jambu","merah muda","merah darah","merah terang"],correctIndex:0,explanation:"'merah jambu' (pink) ialah kata adjektif warna yang dieja terpisah."},{id:W(),topicId:4,pattern:"A",text:"Jalan ke kampung itu amat ________ dan berbengkang-bengkok.",options:["lurus","sempit","luas","nipis"],correctIndex:1,explanation:"'sempit' merujuk kepada ukuran lebar jalan yang kecil, sesuai dengan konteks."},{id:W(),topicId:4,pattern:"B",text:"Analisis Hukum: 'Pemandangan di pantai itu sungguh sangat indah nian.'",options:["BENAR","SALAH"],correctIndex:1,explanation:"SALAH. Penggunaan kata penguat darjah penghabisan berganda (sungguh sangat ... nian) adalah lewah (berlebihan)."},{id:W(),topicId:4,pattern:"A",text:"Buah mangga itu terasa sangat ________.",options:["manis","masin","pahit","pedas"],correctIndex:0,explanation:"'manis' ialah kata adjektif pancaindera rasa untuk buah yang sudah masak."},{id:W(),topicId:4,pattern:"A",text:"Murid yang ________ itu sering mendapat tempat pertama dalam kelas.",options:["cerdik","kacak","pantas","bulat"],correctIndex:0,explanation:"'cerdik' merujuk kepada sifat akal yang tajam/pandai."});Ka.push({id:W(),topicId:5,pattern:"A",text:"Puan Aminah membeli tiga ________ sayur bayam di pasar.",options:["ikat","genggam","jambak","helai"],correctIndex:0,explanation:"Sayuran berbatang seperti bayam atau kangkung menggunakan penjodoh bilangan 'ikat'."},{id:W(),topicId:5,pattern:"B",text:"Analisis Hukum: 'Beberapa buah kereta-kereta mewah tersadai di tepi jalan.'",options:["BENAR","SALAH"],correctIndex:1,explanation:"SALAH. Kata bilangan 'beberapa' sudah menunjukkan jamak. Kata nama 'kereta' tidak perlu digandakan. (Betul: Beberapa buah kereta)."},{id:W(),topicId:5,pattern:"A",text:"Datuk membelah sebiji kelapa menggunakan se________ parang.",options:["bilah","batang","laras","keping"],correctIndex:0,explanation:"'bilah' digunakan untuk senjata atau alat tajam (parang, pisau, keris)."},{id:W(),topicId:5,pattern:"A",text:"________ mur
